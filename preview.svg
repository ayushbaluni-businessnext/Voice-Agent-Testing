<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Preview of the Voice Agent showcase page">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="90"/></filter>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5efc"/><stop offset=".55" stop-color="#12d8c2"/><stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5efc"/><stop offset=".5" stop-color="#12d8c2"/><stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#8f7bff"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#5b4be0" stop-opacity=".55"/><stop offset="1" stop-color="#5b4be0" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#05060a"/>
  <g filter="url(#soft)" opacity=".85">
    <circle cx="300" cy="180" r="330" fill="#4b3bf0" opacity=".55"/>
    <circle cx="1250" cy="330" r="300" fill="#00d5c0" opacity=".38"/>
    <circle cx="760" cy="980" r="300" fill="#ff4f81" opacity=".35"/>
  </g>

  <!-- nav -->
  <rect width="1600" height="78" fill="#080a12" opacity=".85"/>
  <line x1="0" y1="78" x2="1600" y2="78" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="71" cy="41" r="7" fill="#12d8c2"/>
  <text x="94" y="50" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f0f5ff">voice<tspan fill="#8f9bb8" font-weight="400">/agent</tspan></text>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#97a3bf">
    <text x="800" y="48">Capabilities</text><text x="955" y="48">Live call</text><text x="1080" y="48">How it works</text><text x="1235" y="48">Numbers</text>
  </g>

  <!-- eyebrow -->
  <rect x="80" y="140" width="470" height="46" rx="23" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="106" y="170" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="2" fill="#c3cde6">REAL-TIME · SPEECH IN, ACTION OUT</text>

  <!-- headline -->
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-2">
    <text x="80" y="300" font-size="82" fill="#eaf0ff">It doesn't just</text>
    <text x="80" y="394" font-size="82" fill="url(#hl)">talk back.</text>
    <text x="80" y="488" font-size="82" fill="#eaf0ff">It gets things done.</text>
  </g>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#8f9bb8">
    <text x="82" y="552">A voice agent hears you, understands intent, calls the tools it needs</text>
    <text x="82" y="590">and answers in speech — in under half a second.</text>
  </g>

  <!-- buttons -->
  <rect x="80" y="646" width="250" height="58" rx="14" fill="url(#btn)"/>
  <text x="124" y="682" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Watch a live call</text>
  <rect x="348" y="646" width="240" height="58" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="392" y="682" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#e1e8fa">What it can do</text>

  <!-- waveform panel -->
  <circle cx="1160" cy="400" r="215" fill="url(#glow)"/>
  <g stroke="url(#bars)" stroke-width="6" stroke-linecap="round">
    <path d="M 860 400 v -14  M 878 400 v -34  M 896 400 v -58  M 914 400 v -86  M 932 400 v -112  M 950 400 v -132
             M 968 400 v -146  M 986 400 v -152  M 1004 400 v -146  M 1022 400 v -128  M 1040 400 v -102
             M 1058 400 v -74  M 1076 400 v -46  M 1094 400 v -22  M 1112 400 v -6  M 1130 400 v -26
             M 1148 400 v -54  M 1166 400 v -86  M 1184 400 v -118  M 1202 400 v -140  M 1220 400 v -150
             M 1238 400 v -138  M 1256 400 v -116  M 1274 400 v -88  M 1292 400 v -60  M 1310 400 v -34
             M 1328 400 v -14  M 1346 400 v -4" fill="none"/>
    <path d="M 860 400 v 14  M 878 400 v 34  M 896 400 v 58  M 914 400 v 86  M 932 400 v 112  M 950 400 v 132
             M 968 400 v 146  M 986 400 v 152  M 1004 400 v 146  M 1022 400 v 128  M 1040 400 v 102
             M 1058 400 v 74  M 1076 400 v 46  M 1094 400 v 22  M 1112 400 v 6  M 1130 400 v 26
             M 1148 400 v 54  M 1166 400 v 86  M 1184 400 v 118  M 1202 400 v 140  M 1220 400 v 150
             M 1238 400 v 138  M 1256 400 v 116  M 1274 400 v 88  M 1292 400 v 60  M 1310 400 v 34
             M 1328 400 v 14  M 1346 400 v 4" fill="none"/>
  </g>

  <!-- mic pill -->
  <rect x="1015" y="570" width="290" height="50" rx="25" fill="#0a0c14" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="1044" cy="595" r="7" fill="#ff5c8a"/>
  <text x="1064" y="601" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#a8b3cc">use your microphone</text>

  <!-- capability chips -->
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#e6eeff">
    <rect x="80" y="800" width="278" height="80" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="104" y="849">Streaming ASR</text>
    <rect x="380" y="800" width="278" height="80" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="404" y="849">Barge-in</text>
    <rect x="680" y="800" width="278" height="80" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="704" y="849">Intent over keywords</text>
    <rect x="980" y="800" width="278" height="80" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="1004" y="849">Tool calls</text>
    <rect x="1280" y="800" width="240" height="80" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="1304" y="849">Code-switch</text>
  </g>

  <text x="80" y="950" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#6f7b96">Design preview of index.html — illustrative rendering, not a browser screenshot.</text>
</svg>
